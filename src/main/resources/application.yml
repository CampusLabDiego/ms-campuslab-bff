spring:
  application:
    name: ms-campuslab-bff

  cloud:
    gateway:
      routes:

        - id: catalog-service
          uri: http://catalog:8081
          predicates:
            - Path=/api/catalog/**

        - id: bookings-service
          uri: http://bookings:8082
          predicates:
            - Path=/api/bookings/**


server:
  port: 8080