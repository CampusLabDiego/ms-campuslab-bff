spring:
  application:
    name: ms-campuslab-bff

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/7d5727ec-99c0-4161-9e1a-194c51532c5b/v2.0

  cloud:
    gateway:
      routes:
        - id: catalog-service
          uri: ${CATALOG_URL:http://catalog:8081}
          predicates:
            - Path=/api/catalog/**

        - id: bookings-service
          uri: ${BOOKINGS_URL:http://bookings:8082}
          predicates:
            - Path=/api/bookings/**

        - id: notifier-service
          uri: ${NOTIFIER_URL:http://notifier:8083}
          predicates:
            - Path=/api/notifications,/api/notifications/**

        - id: rabbit-admin-service
          uri: ${RABBIT_ADMIN_URL:http://rabbit-admin:8084}
          predicates:
            - Path=/api/admin,/api/admin/**

server:
  port: 8080

campuslab:
  security:
    audience: 3bdd9813-1e51-4686-a89a-760ac0531de9