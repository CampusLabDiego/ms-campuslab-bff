spring:

  application:
    name: ms-campuslab-bff


  cloud:

    gateway:

      routes:

        - id: catalog-service
          uri: ${CATALOG_URL:http://catalog:8081}
          predicates:
            - Path=/api/catalog/**


        - id: bookings-service
          uri: ${BOOKINGS_URL:http://bookings:8082}
          predicates:
            - Path=/api/bookings/**


server:

  port: 8080